<template>

    <lightning-card icon-name="standard:people">

        <!-- Header -->

        <div class="header">

            <div class="slds-grid slds-wrap slds-grid_align-spread slds-grid_vertical-align-center">

                <div>

                    <h1 class="title">
                        Vendor Management
                    </h1>

                    <p class="subtitle">
                        Track vendors providing maintenance services.
                    </p>

                </div>

                <div>

                    <lightning-button
                        label="Refresh"
                        icon-name="utility:refresh"
                        onclick={refreshVendors}>
                    </lightning-button>

                    <lightning-button
                        variant="brand"
                        label="New Vendor"
                        icon-name="utility:add"
                        onclick={handleNewVendor}>
                    </lightning-button>

                </div>

                 

            </div>

        </div>

        <!-- Search -->

        <div class="slds-p-around_medium">

            <div class="filterContainer">

                <lightning-layout
                    multiple-rows
                    vertical-align="end">

                    <lightning-layout-item
                        size="12"
                        medium-device-size="8"
                        padding="around-small">

                        <lightning-input
                            type="search"
                            label="Search Vendor"
                            placeholder="Search by Name, Phone or Email"
                            value={searchKey}
                            onchange={handleSearch}>
                        </lightning-input>

                    </lightning-layout-item>

                    <lightning-layout-item
                        size="12"
                        medium-device-size="4"
                        padding="around-small">

                        <lightning-button
                            class="searchButton"
                            label="Clear Search"
                            icon-name="utility:clear"
                            onclick={clearSearch}>
                        </lightning-button>

                    </lightning-layout-item>

                </lightning-layout>

            </div>

        </div>

        <!-- Spinner -->

        <template if:true={isLoading}>

            <lightning-spinner
                alternative-text="Loading"
                size="medium">
            </lightning-spinner>

        </template>

        <!-- Record Count -->

        <div class="slds-p-horizontal_medium">

            <div class="recordCount">

                Showing {startRecord}
                -
                {endRecord}
                of
                {totalRecords}
                Vendors

            </div>

        </div>

        <!-- Datatable -->

        <template if:true={vendors.length}>

            <div class="slds-p-horizontal_medium slds-m-top_small">

                <div class="tableContainer">

                    <lightning-datatable

                        key-field="Id"

                        data={vendors}

                        columns={columns}

                        hide-checkbox-column

                        show-row-number-column>

                    </lightning-datatable>

                </div>

            </div>

        </template>

        <!-- Empty State -->

        <template if:false={vendors.length}>

            <div class="emptyState">

                <lightning-icon
                    icon-name="utility:search"
                    size="large">
                </lightning-icon>

                <h2>

                    No Vendors Found

                </h2>

                <p>

                    Try changing your search criteria.

                </p>

            </div>

        </template>

        <!-- Pagination -->

        <template if:true={vendors.length}>

            <div class="pagination">

                <lightning-button
                    label="Previous"
                    icon-name="utility:chevronleft"
                    onclick={previousPage}
                    disabled={disablePrevious}>
                </lightning-button>

                <span class="pageText">

                    Page {pageNumber}
                    of
                    {totalPages}

                </span>

                <lightning-button
                    label="Next"
                    icon-name="utility:chevronright"
                    icon-position="right"
                    onclick={nextPage}
                    disabled={disableNext}>
                </lightning-button>

            </div>

        </template>

    </lightning-card>
    <!-- ===================== -->
<!-- Create Vendor Modal -->
<!-- ===================== -->

<template if:true={showCreateVendorModal}>

    <section
        role="dialog"
        tabindex="-1"
        aria-modal="true"
        class="slds-modal slds-fade-in-open">

        <div class="slds-modal__container">

            <header class="slds-modal__header">

                <lightning-button-icon
                    icon-name="utility:close"
                    alternative-text="Close"
                    onclick={closeModal}
                    class="slds-modal__close">
                </lightning-button-icon>

                <h2 class="slds-text-heading_medium">

                    Create Vendor

                </h2>

            </header>

            <div class="slds-modal__content slds-p-around_medium">

                <div class="slds-modal__content slds-p-around_medium">

    <lightning-record-edit-form
        object-api-name="Vendor__c"
        onsuccess={handleVendorCreated}>

        <lightning-messages></lightning-messages>

        <lightning-input-field
            field-name="Name">
        </lightning-input-field>

        <lightning-input-field
            field-name="Phone__c">
        </lightning-input-field>

        <lightning-input-field
            field-name="Email__c">
            </lightning-input-field>

            <div class="slds-m-top_large slds-text-align_right">

                <lightning-button
                    label="Cancel"
                    onclick={closeModal}>
                </lightning-button>

                <lightning-button
                    variant="brand"
                    type="submit"
                    label="Save"
                    class="slds-m-left_small">
                </lightning-button>

            </div>

        </lightning-record-edit-form>

    </div>

            </div>

        </div>

    </section>

    <div class="slds-backdrop slds-backdrop_open"></div>

</template>
