<template>

    <lightning-card
        icon-name="standard:contact">

        <!-- Header -->

        <div class="header">

            <div class="slds-grid slds-wrap slds-grid_align-spread slds-grid_vertical-align-center">

                <div>

                    <h1 class="title">
                        Tenant Management
                    </h1>

                    <p class="subtitle">
                        Manage tenants and their contact information.
                    </p>

                </div>

                <div class="buttonGroup">

                    <lightning-button

                        label="Refresh"

                        icon-name="utility:refresh"

                        onclick={refreshTenants}>

                    </lightning-button>

                    <lightning-button

                        variant="brand"

                        label="New Tenant"

                        icon-name="utility:add"

                        onclick={handleNewTenant}

                        class="slds-m-left_small">

                    </lightning-button>

                </div>

            </div>

        </div>

        <!-- Search Section -->

        <div class="slds-p-around_medium">

            <div class="filterContainer">

                <lightning-layout
                    multiple-rows
                    vertical-align="end">

                    <!-- Search -->

                    <lightning-layout-item
                        size="12"
                        medium-device-size="5"
                        padding="around-small">

                        <lightning-input

                            type="search"

                            label="Search"

                            placeholder="Search Tenant Name, Phone or Email"

                            value={searchKey}

                            onchange={handleSearch}>

                        </lightning-input>

                    </lightning-layout-item>

                    <!-- Clear -->

                    <lightning-layout-item
                        size="12"
                        medium-device-size="2"
                        padding="around-small">

                        <lightning-button

                            label="Clear Filters"

                            icon-name="utility:clear"

                            onclick={clearFilters}

                            class="searchButton">

                        </lightning-button>

                    </lightning-layout-item>

                </lightning-layout>

            </div>

        </div>

        <!-- Spinner -->

        <template if:true={isLoading}>

            <lightning-spinner

                alternative-text="Loading"

                size="medium">

            </lightning-spinner>

        </template>

        <!-- Record Count -->

        <div class="slds-p-horizontal_medium">

            <div class="recordCount">

                Showing

                {startRecord}

                -

                {endRecord}

                of

                {totalRecords}

                Tenants

            </div>

        </div>

        <!-- Datatable -->

        <template if:true={tenants.length}>

            <div class="slds-p-horizontal_medium slds-m-top_small">

                <div class="tableContainer">

                    <lightning-datatable

                        key-field="Id"

                        data={tenants}

                        columns={columns}

                        sorted-by={sortedBy}

                        sorted-direction={sortDirection}

                        onsort={handleSort}

                        onrowaction={handleRowAction}

                        hide-checkbox-column

                        show-row-number-column>

                    </lightning-datatable>

                </div>

            </div>

        </template>

        <!-- Empty State -->

        <template if:false={tenants.length}>

            <div class="emptyState">

                <lightning-icon

                    icon-name="utility:info"

                    size="large">

                </lightning-icon>

                <h2>

                    No Tenants Found

                </h2>

                <p>

                    Click

                    <strong>New Tenant</strong>

                    to create your first tenant.

                </p>

            </div>

        </template>

        <!-- Pagination -->

        <template if:true={tenants.length}>

            <div class="pagination">

                <lightning-button

                    label="Previous"

                    icon-name="utility:chevronleft"

                    onclick={previousPage}

                    disabled={disablePrevious}>

                </lightning-button>

                <span class="pageText">

                    Page

                    {pageNumber}

                    of

                    {totalPages}

                </span>

                <lightning-button

                    label="Next"

                    icon-name="utility:chevronright"

                    icon-position="right"

                    onclick={nextPage}

                    disabled={disableNext}>

                </lightning-button>

            </div>

        </template>

    </lightning-card>

</template>
